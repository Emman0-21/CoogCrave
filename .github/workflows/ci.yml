name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Ephemeral CI database credentials (same local-only placeholders as .env.example).
  TEST_DATABASE_URL: postgresql://coogcrave_app:local_app_pw@localhost:5432/coogcrave_test
  TEST_MIGRATOR_DATABASE_URL: postgresql://coogcrave_migrator:local_migrator_pw@localhost:5432/coogcrave_test

jobs:
  quality:
    name: Format, lint, types, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (locked)
        run: pnpm install --frozen-lockfile
      - name: No environment files committed
        run: pnpm check:tracked-env
      - name: Formatting
        run: pnpm format:check
      - name: Lint (includes security and layering rules)
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level=high

  test:
    name: Tests and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (locked)
        run: pnpm install --frozen-lockfile
      - name: Create least-privilege roles and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f scripts/sql/bootstrap-roles.sql
        env:
          PGPASSWORD: postgres
      - name: Migration drift check
        run: pnpm db:drift
      - name: Apply migrations to a fresh database
        run: pnpm db:migrate
        env:
          MIGRATOR_DATABASE_URL: ${{ env.TEST_MIGRATOR_DATABASE_URL }}
      - name: Unit and component tests
        run: pnpm test:unit && pnpm test:component
      - name: Integration tests (real Postgres, app role)
        run: pnpm test:integration
      - name: Coverage gate (80% of server code)
        run: pnpm test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (locked)
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          APP_ENV: production
